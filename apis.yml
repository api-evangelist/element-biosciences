aid: element-biosciences
name: Element Biosciences
description: 'Element Biosciences is a San Diego based life-sciences instrumentation company that builds
  benchtop DNA sequencing and multiomics systems — the AVITI, AVITI LT, AVITI24 and VITARI platforms —
  around its proprietary Avidite Base Chemistry (ABC), which decouples signal generation from nucleotide
  incorporation to deliver high-accuracy base calling at lower cost than conventional sequencing-by-synthesis.
  Instrument output is managed through ElemBio Cloud, the company''s analysis and data-management platform,
  which runs bioinformatics workflows such as Bases2Fastq and Cells2Stats and streams run data into
  customer-owned cloud storage connections. ElemBio Cloud exposes a public, versioned REST API — the
  Element Biosciences Cloud API — plus a first-party cross-platform CLI, giving labs programmatic access
  to sequencing and multiomics runs, workflow executions, registered instruments, storage connections and
  the files those resources produce, for dashboards, fleet monitoring, LIMS read-back and custom automation.'
