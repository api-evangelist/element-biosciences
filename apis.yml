apis:
- aid: element-biosciences:cloud-api
  name: Element Biosciences Cloud API
  description: 'The Element Biosciences Cloud API provides programmatic, read-oriented access to data in
    the ElemBio Cloud platform: instrument runs (sequencing and multiomics), workflow executions,
    registered instruments, storage connections, and the files those resources produce. All paths are
    versioned under /v1. Requests authenticate with an API key in the x-api-key header, scoped per
    resource and action. List endpoints are cursor-paginated and support a keyword-expression filter
    language with comparison operators and relative date offsets.'
