- aid: element-biosciences:element-biosciences-storageconnectionservice-api
  name: Element Biosciences Storage Connection Service API
  description: >-
    StorageConnectionService provides access to storage connections: their
     metadata (requires the "storage:read" scope) and the files within them
     (ListFiles / GetDownloadCredentials, which require the "storage:download"
     scope, narrowable to a specific connection or path prefix). Connections that
     are deleted, disabled, or queued for deletion are not returned.
  humanURL: https://docs.elembio.io/developers/api/
