  date: '2026-07-21'
  title: ElemBio Cloud API general availability
  breaking: []
  additions:
  - List and filter runs with keyword expressions, comparison operators and relative date offsets
  - Retrieve a specific run by ID, list its files, and download them
  - Access workflow execution data (for example Bases2Fastq) filtered by status or source run
  - Look up the instruments registered to an organization
  - Browse and download files from storage connections, with prefix filtering
  - Interactive API reference documentation for testing endpoints
