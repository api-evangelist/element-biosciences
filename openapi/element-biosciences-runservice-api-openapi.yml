    elembio.cloud.v1.Output:
      type: object
      properties:
        storageConnectionId:
          type: string
          title: storage_connection_id
          description: Storage connection ID
        uri:
          type: string
          title: uri
          description: "Absolute URI of the output directory. May be empty if the\n upstream resource has not yet determined its output location.\n When non-empty, normalized to end in exactly one trailing slash.\n Example: s3://bucket/path/to/dir/"
        kinds:
          type: array
          items:
            type: string
          title: kinds
          description: "Content kinds present under uri. Possible values:\n   \"fastq\", \"bam\", \"vcf\", \"cram\", \"parquet\",\n   \"sequencing_run\", \"multiomics_run\".\n May be empty for in-flight executions: WorkflowRunSummary\n populates output kinds late in the lifecycle, so a running\n execution can briefly surface an Output with empty kinds even\n when the workflow definition declares them."
      title: Output
      additionalProperties: false
      description: "Output describes where a resource's output files live and what\n kinds of content are produced. Used by both Run and Execution."
