                    type: string
                    title: storage_connection_id
                    description: The storage connection ID
                - name: prefix
                  in: query
                  description: |-
                    Prefix to scope credentials to a subdirectory, relative to the storage
                     connection's configured root. Matches the --prefix semantics of ListFiles:
                     optional for an unrestricted key (omitted ⇒ connection root), but required
                     and bounded to scope for a key scoped to a path prefix — omitting it or
                     naming one outside the scope returns PermissionDenied with the allowed
                     prefix(es) (`allowed_prefixes` metadata).
                  schema:
                    type: string
