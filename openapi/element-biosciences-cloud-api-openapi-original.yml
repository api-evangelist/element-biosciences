                pageToken:
                    type:
                        - string
                        - "null"
                    title: page_token
                    description: |-
                        Pagination token from a previous response's next_page_token. Omit to
                         request the first page.
            title: ListInstrumentsRequest
            additionalProperties: false
            description: Request to list instruments.
        elembio.cloud.v1.ListInstrumentsResponse:
            type: object
