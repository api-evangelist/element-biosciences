                - RunService
            summary: ListRunFiles
            description: List the files produced by a run, drawn from the run's storage location.
            operationId: RunService_ListRunFiles
            parameters:
                - name: run_id
                  in: path
                  description: The run ID
                  required: true
                  schema:
                    type: string
                    title: run_id
                    description: The run ID
                - name: prefix
                  in: query
                  description: |-
