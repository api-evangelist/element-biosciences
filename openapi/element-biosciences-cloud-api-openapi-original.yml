        google.protobuf.Timestamp:
            type: string
            examples:
                - "2023-01-15T01:30:15.01Z"
                - "2024-12-25T12:00:00Z"
            format: date-time
            description: |-
                A Timestamp represents a point in time independent of any time zone or local
                 calendar, encoded as a count of seconds and fractions of seconds at
                 nanosecond resolution. The count is relative to an epoch at UTC midnight on
                 January 1, 1970, in the proleptic Gregorian calendar which extends the
                 Gregorian calendar backwards to year one.

                 All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
                 second table is needed for interpretation, using a [24-hour linear
                 smear](https://developers.google.com/time/smear).

                 The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
                 restricting to that range, we ensure that we can convert to and from [RFC
                 3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

                 # Examples

                 Example 1: Compute Timestamp from POSIX `time()`.

                     Timestamp timestamp;
                     timestamp.set_seconds(time(NULL));
                     timestamp.set_nanos(0);

                 Example 2: Compute Timestamp from POSIX `gettimeofday()`.

                     struct timeval tv;
                     gettimeofday(&tv, NULL);

                     Timestamp timestamp;
                     timestamp.set_seconds(tv.tv_sec);
                     timestamp.set_nanos(tv.tv_usec * 1000);

                 Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

                     FILETIME ft;
                     GetSystemTimeAsFileTime(&ft);
                     UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

                     // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
                     // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
                     Timestamp timestamp;
                     timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
                     timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

                 Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

                     long millis = System.currentTimeMillis();

                     Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                         .setNanos((int) ((millis % 1000) * 1000000)).build();

                 Example 5: Compute Timestamp from Java `Instant.now()`.

                     Instant now = Instant.now();

                     Timestamp timestamp =
                         Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                             .setNanos(now.getNano()).build();

                 Example 6: Compute Timestamp from current time in Python.

                     timestamp = Timestamp()
                     timestamp.GetCurrentTime()

                 # JSON Mapping

                 In JSON format, the Timestamp type is encoded as a string in the
                 [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
                 format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
                 where {year} is always expressed using four digits while {month}, {day},
                 {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
                 seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
                 are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
                 is required. A ProtoJSON serializer should always use UTC (as indicated by
                 "Z") when printing the Timestamp type and a ProtoJSON parser should be
                 able to accept both UTC and other timezones (as indicated by an offset).

                 For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
                 01:30 UTC on January 15, 2017.

                 In JavaScript, one can convert a Date object to this format using the
                 standard
                 [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
                 method. In Python, a standard `datetime.datetime` object can be converted
                 to this format using
                 [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
                 the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
                 the Joda Time's [`ISODateTimeFormat.dateTime()`](
                 http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
                 ) to obtain a formatter capable of generating timestamps in this format.
paths:
    /v1/auth:
        get:
            tags:
                - AuthService
            summary: GetAuth
            description: |-
                Return the tenant the current API key belongs to. This endpoint requires a
                 valid API key but no additional scope, so it is a convenient way to verify
                 that a key is working.
            operationId: AuthService_GetAuth
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/elembio.cloud.v1.GetAuthResponse'
                "400":
                    description: Bad request — the request was malformed or a parameter was invalid.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "401":
                    description: Unauthorized — the API key is missing or invalid.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "403":
                    description: Forbidden — the API key lacks the required scope.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "404":
                    description: Not found — the requested resource does not exist or is not accessible.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "500":
                    description: Internal server error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/executions:
        get:
            tags:
                - ExecutionService
            summary: ListExecutions
            description: |-
                List executions accessible to the authenticated tenant, optionally
                 filtered.
            operationId: ExecutionService_ListExecutions
            parameters:
                - name: filter
                  in: query
                  description: |-
                    Search and filter expression. Space-separated `keyword:value` terms are
                     ANDed together; bare text with no keyword searches all string fields. For
                     date fields, replace the colon with a comparison operator (`>=`, `<=`,
                     `>`, `<`, `!=`). List alternatives for one keyword with commas, e.g.
                     `status:running,pending`. Dates accept ISO-8601 or relative offsets such
                     as `24h`, `7d`, or `1mo`.

                     Filterable keywords:

                     - **String:** `name`, `input.run.id`, `input.run.name`, `input.run.instrument_name`, `input.execution.id`, `input.execution.name`, `flow.name`, `workflow.name`, `started_by`
                     - **Enum:** `status`, `platform` (`aws_omics`, `seqera`, `dnanexus`, `catalyst`), `output.kind` (`fastq`, `bam`, `vcf`, `cram`, `parquet`)
                     - **Date:** `time_created`, `time_started`, `time_completed`, `time_updated`

                     Examples:

                     - `workflow.name:bases2fastq status:running`
                     - `platform:seqera output.kind:fastq time_completed>=24h`
                  schema:
                    type: string
                    title: filter
                    description: |-
                        Search and filter expression. Space-separated `keyword:value` terms are
                         ANDed together; bare text with no keyword searches all string fields. For
                         date fields, replace the colon with a comparison operator (`>=`, `<=`,
                         `>`, `<`, `!=`). List alternatives for one keyword with commas, e.g.
                         `status:running,pending`. Dates accept ISO-8601 or relative offsets such
                         as `24h`, `7d`, or `1mo`.

                         Filterable keywords:

                         - **String:** `name`, `input.run.id`, `input.run.name`, `input.run.instrument_name`, `input.execution.id`, `input.execution.name`, `flow.name`, `workflow.name`, `started_by`
                         - **Enum:** `status`, `platform` (`aws_omics`, `seqera`, `dnanexus`, `catalyst`), `output.kind` (`fastq`, `bam`, `vcf`, `cram`, `parquet`)
                         - **Date:** `time_created`, `time_started`, `time_completed`, `time_updated`

                         Examples:

                         - `workflow.name:bases2fastq status:running`
                         - `platform:seqera output.kind:fastq time_completed>=24h`
                - name: pageSize
                  in: query
                  description: 'Maximum number of executions to return (default: 100, max: 1000)'
                  schema:
                    type: integer
                    title: page_size
                    format: int32
                    description: 'Maximum number of executions to return (default: 100, max: 1000)'
                - name: pageToken
                  in: query
                  description: Token for pagination
                  schema:
                    type: string
                    title: page_token
                    description: Token for pagination
                - name: includeTotalCount
                  in: query
                  description: If true, include total_count in the response (adds a count query)
                  schema:
                    type: boolean
                    title: include_total_count
                    description: If true, include total_count in the response (adds a count query)
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/elembio.cloud.v1.ListExecutionsResponse'
                "400":
                    description: Bad request — the request was malformed or a parameter was invalid.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "401":
                    description: Unauthorized — the API key is missing or invalid.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "403":
                    description: Forbidden — the API key lacks the required scope.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "404":
                    description: Not found — the requested resource does not exist or is not accessible.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "500":
                    description: Internal server error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/executions/{execution_id}/credentials:
        get:
            tags:
                - ExecutionService
            summary: GetExecutionDownloadCredentials
            description: |-
                Get temporary, read-only S3 credentials scoped to an execution's storage
                 location. Use these for bulk or repeated downloads via the AWS CLI or SDK
                 instead of per-object presigned URLs.
            operationId: ExecutionService_GetExecutionDownloadCredentials
            parameters:
                - name: execution_id
                  in: path
                  description: The execution ID
                  required: true
                  schema:
                    type: string
                    title: execution_id
                    description: The execution ID
                - name: prefix
                  in: query
                  description: |-
                    Optional path prefix within the execution to scope credentials to.
                     Execution-relative, identical semantics to
                     ListExecutionFilesRequest.prefix. ".." segments are rejected.
                     When omitted, credentials are scoped to the whole execution (the
                     execution root).
                  schema:
                    type: string
                    title: prefix
                    description: |-
                        Optional path prefix within the execution to scope credentials to.
                         Execution-relative, identical semantics to
                         ListExecutionFilesRequest.prefix. ".." segments are rejected.
                         When omitted, credentials are scoped to the whole execution (the
                         execution root).
                - name: expirationSeconds
                  in: query
                  description: |-
                    Lifetime of the returned credentials, in seconds. Optional; defaults to
                     1 hour (when 0 or unset). Minimum 900s. Capped by AWS: up to 36h (129600s)
                     for federation-token connections, or the role's MaxSessionDuration (12h
                     typical) for role-backed connections. Values below the minimum or above the
                     cap are rejected.
                  schema:
                    type: integer
                    title: expiration_seconds
                    format: int32
                    description: |-
                        Lifetime of the returned credentials, in seconds. Optional; defaults to
                         1 hour (when 0 or unset). Minimum 900s. Capped by AWS: up to 36h (129600s)
                         for federation-token connections, or the role's MaxSessionDuration (12h
                         typical) for role-backed connections. Values below the minimum or above the
                         cap are rejected.
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/elembio.cloud.v1.GetExecutionDownloadCredentialsResponse'
                "400":
                    description: Bad request — the request was malformed or a parameter was invalid.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "401":
                    description: Unauthorized — the API key is missing or invalid.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "403":
                    description: Forbidden — the API key lacks the required scope.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "404":
                    description: Not found — the requested resource does not exist or is not accessible.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "500":
                    description: Internal server error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
    /v1/executions/{execution_id}/files:
        get:
            tags:
                - ExecutionService
            summary: ListExecutionFiles
            description: |-
                List the files produced by an execution, drawn from the execution's
                 storage location.
            operationId: ExecutionService_ListExecutionFiles
            parameters:
                - name: execution_id
                  in: path
                  description: The execution ID
                  required: true
                  schema:
                    type: string
                    title: execution_id
                    description: The execution ID
                - name: prefix
                  in: query
                  description: |-
                    Path prefix within the execution, e.g. "visualization/" or "Stats/foo".
                     The execution is a self-contained namespace: paths do not include any
                     bucket-level or workflow-level layout. Round-trips with File.path
                     returned by this RPC. ".." segments are rejected.
                     Optional: when omitted, lists the whole execution (the execution root).
                  schema:
                    type: string
                    title: prefix
                    description: |-
                        Path prefix within the execution, e.g. "visualization/" or "Stats/foo".
                         The execution is a self-contained namespace: paths do not include any
                         bucket-level or workflow-level layout. Round-trips with File.path
                         returned by this RPC. ".." segments are rejected.
                         Optional: when omitted, lists the whole execution (the execution root).
                - name: recursive
                  in: query
                  description: |-
                    If true, list all files recursively under the prefix (default: true)
                     If false, list only files and subdirectories at the current level
                  schema:
                    type: boolean
                    title: recursive
                    description: |-
                        If true, list all files recursively under the prefix (default: true)
                         If false, list only files and subdirectories at the current level
                - name: pageSize
                  in: query
                  description: 'Maximum number of files to return per page (default: 1000, max: 1000)'
                  schema:
                    type: integer
                    title: page_size
                    format: int32
                    description: 'Maximum number of files to return per page (default: 1000, max: 1000)'
                - name: pageToken
                  in: query
                  description: Continuation token from previous response (passthrough from storage)
                  schema:
                    type: string
                    title: page_token
                    description: Continuation token from previous response (passthrough from storage)
                - name: includeDownloadUrl
                  in: query
                  description: |-
                    If true, populate File.download_url (a presigned URL) on each returned
                     file. Defaults to false. Set to true only when the caller intends to
                     fetch file content from the response: generating presigned URLs has a
                     per-object cost and the URLs themselves are credentials with a
                     multi-hour lifetime. Use GetExecutionDownloadCredentials when
                     long-lived bulk access is required.
                  schema:
                    type: boolean
                    title: include_download_url
                    description: |-
                        If true, populate File.download_url (a presigned URL) on each returned
                         file. Defaults to false. Set to true only when the caller intends to
                         fetch file content from the response: generating presigned URLs has a
                         per-object cost and the URLs themselves are credentials with a
                         multi-hour lifetime. Use GetExecutionDownloadCredentials when
                         long-lived bulk access is required.
                - name: downloadUrlExpirationSeconds
                  in: query
                  description: |-
                    Lifetime of the presigned download_url, in seconds. Optional; defaults to
                     1 hour. Only applies when include_download_url = true. Max 7 days.
                  schema:
                    type: integer
                    title: download_url_expiration_seconds
                    format: int32
                    description: |-
                        Lifetime of the presigned download_url, in seconds. Optional; defaults to
                         1 hour. Only applies when include_download_url = true. Max 7 days.
                - name: includeDownloadChecksum
                  in: query
                  description: |-
                    If true, presign each download_url with S3 ChecksumMode=ENABLED so the
                     object's stored checksum is returned on the GET (in the
                     x-amz-checksum-<algo> response header) and a client can verify download
                     integrity in a single streaming pass. Defaults false; has no effect unless
                     include_download_url = true. When enabled the presigned URL signs the
                     x-amz-checksum-mode request header, so the fetch MUST send
                     x-amz-checksum-mode:ENABLED — a plain GET that omits it fails with HTTP
                     403. Best-effort: objects stored without a checksum return none.

                     Applies only to AWS S3-backed storage connections; other storage backends
                     do not presign S3 GETs and silently ignore this field.
                  schema:
                    type: boolean
                    title: include_download_checksum
                    description: |-
                        If true, presign each download_url with S3 ChecksumMode=ENABLED so the
                         object's stored checksum is returned on the GET (in the
                         x-amz-checksum-<algo> response header) and a client can verify download
                         integrity in a single streaming pass. Defaults false; has no effect unless
                         include_download_url = true. When enabled the presigned URL signs the
                         x-amz-checksum-mode request header, so the fetch MUST send
                         x-amz-checksum-mode:ENABLED — a plain GET that omits it fails with HTTP
                         403. Best-effort: objects stored without a checksum return none.

                         Applies only to AWS S3-backed storage connections; other storage backends
                         do not presign S3 GETs and silently ignore this field.
            responses:
                "200":
                    description: Success
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/elembio.cloud.v1.ListExecutionFilesResponse'
                "400":
                    description: Bad request — the request was malformed or a parameter was invalid.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                "401":
                    description: Unauthorized — the API key is missing or invalid.
                    content:
                        application/json:
                            schema:
