tags:
    - name: AuthService
      description: AuthService reports information about the API key making the request.
    - name: ExecutionService
      description: |-
        ExecutionService provides access to workflow executions — runs of a
         bioinformatics workflow that process instrument data. Listing and reading
         execution metadata requires the "executions:read" scope; listing files and
         obtaining download credentials requires "executions:download"; retrieving
         logs requires "executions:logs".
    - name: InstrumentService
      description: |-
        InstrumentService provides access to instruments registered to the
         authenticated tenant. Requires the "instruments:read" scope.
    - name: RunService
      description: |-
        RunService provides access to instrument runs, both sequencing and
         multiomics. Listing and reading run metadata requires the "runs:read"
         scope; listing run files and obtaining download credentials requires the
         "runs:download" scope.
    - name: StorageConnectionService
      description: |-
        StorageConnectionService provides access to storage connections: their
         metadata (requires the "storage:read" scope) and the files within them
         (ListFiles / GetDownloadCredentials, which require the "storage:download"
         scope, narrowable to a specific connection or path prefix). Connections that
         are deleted, disabled, or queued for deletion are not returned.
