summary: |
  Four core entities — Run, Execution, Instrument, StorageConnection — plus a File
  projection that hangs off three of them. An Instrument produces Runs; a Run's output
  lands in a StorageConnection; an Execution consumes one or more Runs as inputs and
  produces its own output. Files are not independently addressable: they are always
  listed relative to a parent run, execution, or storage connection, and are fetched
  with short-lived vended S3 credentials rather than through the API itself.
identifiers:
  style: type-prefixed opaque string
  example: seq_507f1f77bcf86cd799439011
  prefixes_documented: partial
  note: The docs give `seq_` for a sequencing run as the illustrative example. A complete prefix registry is NOT published, so no other prefixes are asserted here.
