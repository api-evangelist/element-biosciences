  kinds: [sequencing, multiomics]
  status_enum: [RUN_STATUS_UNSPECIFIED, RUN_STATUS_CREATED, RUN_STATUS_PRIMING, RUN_STATUS_PRIMED, RUN_STATUS_SEQUENCING, RUN_STATUS_RUNNING, RUN_STATUS_PAUSING, RUN_STATUS_PAUSED, RUN_STATUS_STOPPING, RUN_STATUS_SEQUENCED, RUN_STATUS_COMPLETED, RUN_STATUS_FAILED, RUN_STATUS_STOPPED, RUN_STATUS_DISCARDED]
  key_fields: [id, name, description, type, status, instrument, output, timeCreated, timeStarted, timeCompleted, timeUpdated, tags, recipe, manifest, design, operator, setup, metrics]
- name: Execution
