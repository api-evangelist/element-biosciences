  scopes: ['executions:read', 'executions:download', 'executions:logs']
  status_enum: [EXECUTION_STATUS_UNSPECIFIED, EXECUTION_STATUS_INITIALIZED, EXECUTION_STATUS_UNTRIGGERED, EXECUTION_STATUS_PENDING, EXECUTION_STATUS_RUNNING, EXECUTION_STATUS_COMPLETED, EXECUTION_STATUS_FAILED, EXECUTION_STATUS_CANCELED]
  key_fields: [id, name, status, statusDescription, platform, workflow, flow, inputs, output, startedBy, timeCreated, timeStarted, timeCompleted, errorMessage]
- name: Instrument
  schema: elembio.cloud.v1.Instrument
  id_field: serialNumber
  operations: [InstrumentService_ListInstruments, InstrumentService_GetInstrument]
  scopes: ['instruments:read']
  status_enum: [INSTRUMENT_STATUS_UNSPECIFIED, INSTRUMENT_STATUS_ACTIVE, INSTRUMENT_STATUS_INACTIVE, INSTRUMENT_STATUS_DECOMMISSIONED]
  key_fields: [serialNumber, name, model, status, timeCreated, timeUpdated, timeLastConnected, softwareVersion]
- name: StorageConnection
  schema: elembio.cloud.v1.StorageConnection
  id_field: id
  operations: [StorageConnectionService_ListStorageConnections, StorageConnectionService_GetStorageConnection, StorageConnectionService_ListFiles, StorageConnectionService_GetDownloadCredentials]
  scopes: ['storage:read', 'storage:download']
  status_enum: [STORAGE_CONNECTION_STATUS_UNSPECIFIED, STORAGE_CONNECTION_STATUS_CONNECTED, STORAGE_CONNECTION_STATUS_WARNING, STORAGE_CONNECTION_STATUS_FAILED]
  key_fields: [id, name, type, status, uri, timeCreated, timeUpdated]
  note: Connections that are deleted, disabled, or queued for deletion are not returned.
- name: File
  schema: elembio.cloud.v1.File
  id_field: path
  addressable: via-parent-only
  operations: [RunService_ListRunFiles, ExecutionService_ListExecutionFiles, StorageConnectionService_ListFiles]
  key_fields: [path, name, size, lastModified, uri, downloadUrl, storageClass]
- name: S3Credentials
  schema: elembio.cloud.v1.S3Credentials
  kind: value-object
